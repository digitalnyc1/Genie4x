name: Release

on:
  push:
    tags:
      - '4*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. 4.0.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Genie4.sln

      - name: Publish
        run: dotnet publish Genie4.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "Genie4x-$env:TAG-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            Genie4x-${{ env.TAG }}-win-x64.zip
          generate_release_notes: true
